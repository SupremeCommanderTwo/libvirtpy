[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libvirtpy"
version = "0.1.0"
description = "Pure-Python libvirt: typed XML models, wire protocol and sync/async client"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SupremeCommanderTwo" }]
keywords = ["libvirt", "xml", "pydantic", "asyncio", "kvm", "qemu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Emulators",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14",
    "pydantic-xml[lxml]>=2.22",
]

[project.urls]
Homepage = "https://github.com/SupremeCommanderTwo/libvirtpy"
Repository = "https://github.com/SupremeCommanderTwo/libvirtpy"
Issues = "https://github.com/SupremeCommanderTwo/libvirtpy/issues"
Changelog = "https://github.com/SupremeCommanderTwo/libvirtpy/blob/master/CHANGELOG.md"
Documentation = "https://libvirtpy.readthedocs.io"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
]
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
]

[tool.hatch.build.targets.sdist]
exclude = [".idea", ".cache", "docs/_build", ".venv", "AGENTS.md", "CLAUDE.md", ".claude"]

[tool.hatch.build.targets.wheel]
packages = ["src/libvirtpy"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "N", "A", "PLW2901", "RUF", "PERF", "ARG", "PIE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic in comments is fine
    "RUF012",  # pydantic and ClassVar-heavy generated classes
    "ARG002",  # hooks with a fixed signature (pydantic-xml, protocols)
    "ARG003",
]

[tool.ruff.lint.per-file-ignores]
"tests/live/xml_fixtures.py" = ["E501"]
"tests/live/*.py" = ["PERF401"]
"docs/conf.py" = ["ARG001"]  # Sphinx hook signature

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus run is separate: pytest -m corpus
# a leaked socket, pipe or process is a bug: make it fail the test run
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
addopts = "-ra --strict-markers -m 'not corpus and not libvirt and not libvirt_write'"
markers = [
    "corpus: needs the libvirt sample corpus (run tools/fetch_samples.py first)",
    "libvirt: talks to a real libvirt daemon on this machine (read-only; pytest -m libvirt)",
    "libvirt_write: creates, changes and removes throwaway objects (lvxtest-*) on the real daemon (pytest -m libvirt_write)",
]

[tool.coverage.run]
source = ["libvirtpy"]
branch = false

[tool.coverage.report]
# The default (offline) run covers the library at 98%; the live tests and the
# corpus add more. A drop below this means new code without tests.
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
